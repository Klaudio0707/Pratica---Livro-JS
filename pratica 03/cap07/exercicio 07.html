<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Caixa de Loja</title>
  </head>
  <body>
    <h1>Programa caixa de Loja</h1>
    <form>
      <p>
        Data de Vencimento:
        <input type="date" id="inDataVenc" autofocus required />
      </p>
      <p>
        Valor da Conta:
        <input
          type="number"
          id="inValor"
          min="0"
          step="0.01"
          class="alinha-direita"
          required
        />
        <input type="submit" value="Calcular Multa e Juros" />
      </p>
      <p>
        Valor da Multa:
        <input type="number" id="outMulta" class="alinha-direita" readonly />
      </p>
      <p>
        Valor do Juros R$.:
        <input type="number" id="outJuros" class="alinha-direita" readonly />
      </p>
      <p>
        Total a Pagar R$... :
        <input type="number" id="outTotal" class="alinha-direita" readonly />
        <input type="reset" value="Nova Conta" />
      </p>
    </form>

    <script src="./js/caixaLoja.js" defer></script>
  </body>
</html>
